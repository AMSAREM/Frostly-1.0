<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <rect width="500" height="500" rx="0" fill="white"/>
  
  <defs>
    <!-- Single Quadrant with precise curvature (Top-Right / NE quadrant) -->
    <g id="frostly-quadrant">
      <!-- Outer Lobe Arch (curves from North valley to lobe peak to East valley) -->
      <path d="M 250 148 C 278 148, 342 80, 384 114 C 418 148, 352 222, 352 250" />
      
      <!-- Inner Infinity/Turbine Loop Arch -->
      <path d="M 250 222 C 232 188, 278 116, 326 144 C 354 172, 312 232, 278 250" />
    </g>
  </defs>

  <!-- Group with exact uniform stroke linecap and linejoin -->
  <g stroke="#0052FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center circular core ring -->
    <circle cx="250" cy="250" r="26" />

    <!-- 4 Rotational Symmetry Lobes -->
    <use href="#frostly-quadrant" />
    <use href="#frostly-quadrant" transform="rotate(90, 250, 250)" />
    <use href="#frostly-quadrant" transform="rotate(180, 250, 250)" />
    <use href="#frostly-quadrant" transform="rotate(270, 250, 250)" />
  </g>
</svg>