<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Subtle background cold-chain wave lines -->
  <path d="M 0 140 Q 48 120 96 140 T 192 140 L 192 192 L 0 192 Z" fill="#ffffff" fill-opacity="0.08"/>
  <path d="M 0 155 Q 48 135 96 155 T 192 155 L 192 192 L 0 192 Z" fill="#38bdf8" fill-opacity="0.12"/>
  
  <!-- Central Snowflake & Seafood / Anchor Icon Motif -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Central Thermometer & Snowflake Stem -->
    <circle cx="0" cy="0" r="14" fill="url(#frost)"/>
    <circle cx="0" cy="0" r="8" fill="#4f46e5"/>
    
    <!-- 6 Snowflake arms -->
    <!-- Arm 1 (Up) -->
    <path d="M 0 -14 L 0 -54 M -12 -38 L 0 -26 L 12 -38 M -8 -48 L 0 -42 L 8 -48" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arm 2 (Down) -->
    <path d="M 0 14 L 0 54 M -12 38 L 0 26 L 12 38 M -8 48 L 0 42 L 8 48" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arm 3 (Upper Right) -->
    <g transform="rotate(60)">
      <path d="M 0 -14 L 0 -54 M -12 -38 L 0 -26 L 12 -38" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Arm 4 (Lower Right) -->
    <g transform="rotate(120)">
      <path d="M 0 -14 L 0 -54 M -12 -38 L 0 -26 L 12 -38" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Arm 5 (Lower Left) -->
    <g transform="rotate(240)">
      <path d="M 0 -14 L 0 -54 M -12 -38 L 0 -26 L 12 -38" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Arm 6 (Upper Left) -->
    <g transform="rotate(300)">
      <path d="M 0 -14 L 0 -54 M -12 -38 L 0 -26 L 12 -38" stroke="url(#frost)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Tiny Cryo Badge Indicator -->
  <rect x="120" y="24" width="46" height="20" rx="10" fill="#0f172a" fill-opacity="0.6"/>
  <text x="143" y="38" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="10" text-anchor="middle">-60°C</text>
</svg>
